name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The root ROADMAP.md is the only index of open work; plans under
  # docs/superpowers/plans/ and docs/superpowers/specs/ are the only place
  # content lives. Rule: knowledge-base standards/document-lifecycle.md,
  # section 4.
  roadmap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: marlinjai/actions-shared/roadmap-check@roadmap-check-v1
        with:
          max-age: 30

  # The container image for the Coolify server
  # (infra plans/2026-11-10-vercel-sites-to-coolify.md) must keep building and
  # serving while the site still deploys on Vercel, or the move breaks unseen.
  # Builds on ARM like the server, starts the image without secrets (the build
  # and the pages need none; the Sanity dataset is public), and checks the
  # health route and a percent-encoded sitemap URL, which the self-hosted
  # server only serves through src/proxy.ts.
  container:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: parkbad:ci
          build-args: |
            NEXT_PUBLIC_SANITY_PROJECT_ID=qyrn8cjm
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Serve and probe the image
        run: |
          set -euo pipefail
          docker run -d --name parkbad --memory 512m -p 3000:3000 -e APP_ENV=production \
            --entrypoint sh parkbad:ci -c 'export HOSTNAME=0.0.0.0 PORT=3000; exec node server.js'
          trap 'echo "--- container log"; docker logs parkbad' ERR
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break; sleep 1; done
          health="$(curl -fsS http://127.0.0.1:3000/api/health)"
          case "$health" in
            *'"commit":"${{ github.sha }}"'*) echo "health: $health" ;;
            *) echo "::error::/api/health did not report ${{ github.sha }}: $health"; false ;;
          esac
          for path in / /Bildgalerie /Essen%26Trinken '/Essen&Trinken' /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path $code"
            [ "$code" = "200" ] || false
          done
